<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565FF"/>
      <stop offset="100%" stop-color="#0D40CC"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D8BFF"/>
      <stop offset="100%" stop-color="#1565FF"/>
    </linearGradient>
  </defs>

  <!-- Left building -->
  <rect x="8" y="38" width="22" height="42" rx="2" fill="url(#g2)"/>
  <!-- Left building windows -->
  <rect x="12" y="44" width="6" height="4" rx="1" fill="white" fill-opacity="0.35"/>
  <rect x="12" y="53" width="6" height="4" rx="1" fill="white" fill-opacity="0.35"/>
  <rect x="12" y="62" width="6" height="4" rx="1" fill="white" fill-opacity="0.35"/>

  <!-- Center building (tallest) -->
  <rect x="34" y="14" width="26" height="66" rx="2" fill="#0D1B3D"/>
  <!-- Center peak/cap -->
  <polygon points="47,4 60,14 34,14" fill="#0D1B3D"/>
  <!-- Center building windows -->
  <rect x="39" y="24" width="7" height="5" rx="1" fill="white" fill-opacity="0.25"/>
  <rect x="50" y="24" width="7" height="5" rx="1" fill="white" fill-opacity="0.25"/>
  <rect x="39" y="35" width="7" height="5" rx="1" fill="white" fill-opacity="0.25"/>
  <rect x="50" y="35" width="7" height="5" rx="1" fill="white" fill-opacity="0.25"/>
  <rect x="39" y="46" width="7" height="5" rx="1" fill="white" fill-opacity="0.25"/>
  <rect x="50" y="46" width="7" height="5" rx="1" fill="white" fill-opacity="0.25"/>

  <!-- Right building -->
  <rect x="64" y="28" width="22" height="52" rx="2" fill="url(#g2)"/>
  <!-- Right building windows (horizontal stripes) -->
  <rect x="68" y="34" width="14" height="3" rx="1" fill="white" fill-opacity="0.4"/>
  <rect x="68" y="42" width="14" height="3" rx="1" fill="white" fill-opacity="0.4"/>
  <rect x="68" y="50" width="14" height="3" rx="1" fill="white" fill-opacity="0.4"/>
  <rect x="68" y="58" width="14" height="3" rx="1" fill="white" fill-opacity="0.4"/>

  <!-- Checkmark / swoosh base -->
  <path d="M6 88 L50 98 L94 88" stroke="url(#g1)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
